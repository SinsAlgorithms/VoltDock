[package]
name = "voltdock"
version = "0.2.0"
edition = "2024"
description = "VoltDock — Lightweight Windows desktop battery widget for 2.4GHz and Bluetooth wireless peripherals built with Rust and GPUI Kit"

[dependencies]
gpui-kit = "0.10.0"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
chrono = "0.4"
anyhow = "1"
log = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Devices_Power",
    "Foundation",
    "Gaming_Input",
    "Storage_Streams",
    "System_Power",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
